name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_existing:
        description: Verify the published version without rebuilding or uploading assets
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install locked dependencies and desktop runtime
        run: |
          npm.cmd ci
          node node_modules/electron/install.js
      - name: Test
        run: npm.cmd test
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - name: Build native host and portable app
        if: inputs.verify_existing != true
        run: |
          npm.cmd run native:build
          npm.cmd run dist
      - name: Download the published portable app for verification
        if: inputs.verify_existing == true
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $name = "QueuePrint-$version-win-x64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/$name" -OutFile (Join-Path 'release' $name)
      - name: Verify all packaged source and native components
        if: inputs.verify_existing != true
        run: node scripts/check-package.mjs
      - name: Verify repeated portable launches
        run: npm.cmd run qa:portable
      - name: Write checksums
        if: inputs.verify_existing != true
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath release -Filter 'QueuePrint-*-win-x64.exe' -File
          $lines = $files | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release\SHA256SUMS.txt'), ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v7
        if: inputs.verify_existing != true
        with:
          name: QueuePrint-Windows-x64
          path: |
            release/QueuePrint-*-win-x64.exe
            release/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/') && inputs.verify_existing != true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "QueuePrint $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create release.' }
          }
          $assets = @((Get-ChildItem -LiteralPath release -Filter 'QueuePrint-*-win-x64.exe' -File).FullName) + @((Join-Path (Get-Location) 'release\SHA256SUMS.txt'))
          $existing = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          $missing = @($assets | Where-Object { (Split-Path -Leaf $_) -notin $existing })
          if ($missing.Count -gt 0) {
            gh release upload $tag @missing --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Unable to upload release assets.' }
          }
