name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests and native smoke checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install locked dependencies
        run: npm.cmd ci --ignore-scripts
      - name: Test directory ordering, quantities, and submission state
        run: npm.cmd test
      - name: Build the self-contained native host
        run: npm.cmd run native:build
      - name: Inspect, render, and verify plans without printing
        shell: powershell
        run: .\native\tests\smoke.ps1 -SkipPrinterChecks
      - name: Verify output through the exact virtual PDF printer when available
        run: npm.cmd run qa:print-output -- -AllowMissingVirtualPrinter
